[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-trail"
version = "0.2.0"
description = "Plataforma web para o ensino prático de SQL com trilha adaptativa (CAT)."
readme = { text = "Veja o readme.md na raiz do repositório.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
authors = [
    {name = "Brenno Gomes Breda", email = "brenno.breda@icloud.com"}
]
dependencies = [
    "Flask >= 3.1.2",
    "flask-cors >= 6.0.1",
    "Flask-JWT-Extended >= 4.7.1",
    "Flask-SQLAlchemy >= 3.1.1",
    "SQLAlchemy >= 2.0.48",
    "python-dotenv >= 1.2.0",
    "supabase >= 2.22.2",
    "pandas >= 2.3.3",
    "openpyxl >= 3.1.5",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "black",
    "flake8",
]
test = [
    "pytest >= 8.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
